name: Kompilacja gry do EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie kompilacji

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Pobieranie kodu z repozytorium
      uses: actions/checkout@v4

    - name: Instalacja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja potrzebnych bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install pygame numpy pyinstaller

    - name: Kompilacja za pomocą PyInstaller
      run: |
        pyinstaller --onefile --noconsole choły.py

    - name: Udostępnienie gotowego pliku EXE
      uses: actions/upload-artifact@v4
      with:
        name: Krzykacz-Gra-Windows
        path: dist/choły.exe
